<body><div id="login" class="login-shell"><section class="login-brand"><div class="login-identity"><span class="mark">庫</span><span>醫院耗材智慧分析管理平台</span></div><h1>掌握耗用與庫存，<br>讓管理有據可循。</h1><p>整合耗用分析、庫存週轉與跨院比較，<br>追蹤異常及改善進度。</p><div class="login-illustration" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div></section><section class="login-form"><div class="login-card"><div class="login-accent"></div><h2 id="loginTitle">登入系統</h2><p id="loginHint" class="muted">請使用個人帳號登入，依授權使用各院資料與功能。</p><form id="authForm"><label>帳號<input name="username" placeholder="請輸入帳號" autocomplete="username" required minlength="3"></label><label id="nameLabel" hidden>姓名<input name="name" autocomplete="name"></label><label for="loginPassword">密碼</label><div class="password-field"><input id="loginPassword" name="password" type="password" placeholder="請輸入密碼" autocomplete="current-password" required><button id="togglePassword" class="quiet" type="button" aria-label="顯示密碼" aria-pressed="false">顯示</button></div><button class="primary full" id="authSubmit">登入</button></form><p id="authError" role="alert"></p><p class="login-help">帳號申請或密碼重設，請聯絡系統管理員。</p></div><p class="muted small login-reminder">請勿共用帳號，使用完畢請登出。</p><small id="loginVersion" class="login-version"></small></section></div>
<div id="shell" hidden><aside><div class="logo"><span class="mark">庫</span><div>醫院耗材智慧分析<small>管理平台</small></div></div><nav id="nav"></nav><div class="sidebar-foot"><span id="environment"></span></div></aside><main><header><div><h1 id="pageTitle">管理總覽</h1><p id="pageDescription" class="muted"></p></div><div class="account"><details id="accountMenu"><summary><span id="userName"></span> ▾</summary><div class="account-options"><button id="changePassword" class="quiet">變更密碼</button><button id="logout" class="quiet">登出</button></div></details></div><div id="pageActions" class="page-actions"></div></header><section class="toolbar"><label>醫院範圍<select id="hospital"></select></label><label>分析年月<input type="month" id="month"></label><label>科別<select id="analysisDepartment"><option value="">依目前月報</option></select></label><label>耗材分類<select id="materialCategory"><option value="">全部分類</option></select></label><label>比較基準<select id="baseline"><option value="previous">上月</option><option value="year">去年同期</option><option value="mean3" hidden disabled>近3個月平均</option><option value="mean6" hidden disabled>近6個月平均</option></select></label><label>趨勢期間<select id="trendPeriod"><option value="6">近6個月</option><option value="12">近12個月</option><option value="24">近24個月</option></select></label><span id="closedState" class="tag"></span></section><div id="toast" role="status" hidden></div><div id="content" aria-live="polite"></div><footer>所有金額採耗材已確認含稅。未提供資料與不適用指標以「—」呈現。</footer></main></div>
