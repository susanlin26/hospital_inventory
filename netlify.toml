[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.inventory]
  included_files = ["backend/runtime/**", "app/**/*.py", "app/schema.sql", "app/static/**"]

[functions.inventory-worker-background]
  included_files = ["backend/runtime/**", "app/**/*.py", "app/schema.sql", "app/static/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
    Cache-Control = "no-cache, must-revalidate"
